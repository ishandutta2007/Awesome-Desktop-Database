<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Background dynamic pulsing nodes */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .bg-node-1 { animation: pulse 4s ease-in-out infinite; transform-origin: 150px 80px; }
    .bg-node-2 { animation: pulse 6s ease-in-out infinite 1s; transform-origin: 1050px 220px; }
    .floating-card { animation: float 5s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 8 8; animation: wave 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic / Animated Background Elements (Behind text) -->
  <g class="bg-node-1">
    <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
  </g>
  <g class="bg-node-2">
    <circle cx="1050" cy="220" r="140" fill="#c084fc" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- Background Grid & Database Flow Lines -->
  <path d="M 100 250 Q 300 50 600 200 T 1100 80" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.2" class="animated-line"/>
  <path d="M 50 120 Q 400 280 800 100 T 1150 220" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.2" class="animated-line"/>

  <!-- Decorative Database Cylinder Background Icon (Right Side) -->
  <g transform="translate(920, 60)" opacity="0.25">
    <ellipse cx="80" cy="30" rx="70" ry="25" fill="none" stroke="#818cf8" stroke-width="3"/>
    <path d="M 10 30 V 90 A 70 25 0 0 0 150 90 V 30" fill="none" stroke="#818cf8" stroke-width="3"/>
    <path d="M 10 90 V 150 A 70 25 0 0 0 150 150 V 90" fill="none" stroke="#818cf8" stroke-width="3"/>
  </g>

  <!-- Foreground Content Container (Ensures clarity & priority) -->
  <g transform="translate(80, 0)">
    <!-- Subtitle / Tagline pill -->
    <g transform="translate(0, 55)">
      <rect width="280" height="32" rx="16" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="21" class="badge-text">⚡ CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#glow)">Awesome Desktop Database</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">No-Code Databases • Desktop Data Apps • Self-Hosted Alternatives • Form Builders</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 220)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="22" class="badge-text" fill="#38bdf8">💻 Desktop Apps</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(175, 0)">
        <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="22" class="badge-text" fill="#818cf8">🚀 No-Code Tools</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(360, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="22" class="badge-text" fill="#c084fc">🔓 Open-Source</text>
      </g>
    </g>
  </g>
</svg>
